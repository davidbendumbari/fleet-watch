version: "3.8"
services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: solarwatch
      POSTGRES_DB: solarwatch
    volumes:
      - timescale-data:/var/lib/postgresql/data

volumes:
  timescale-data:
