name: fleet-watch
services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: solarwatch
      POSTGRES_DB: solarwatch
    volumes:
      - timescale-data:/var/lib/postgresql/data

  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    depends_on:
      - mqtt-broker
    environment:
      MQTT_BROKER_HOST: mqtt-broker

  consumer:
    build:
      context: .
      dockerfile: services/consumer/Dockerfile
    depends_on:
      - mqtt-broker
      - timescaledb
    environment:
      MQTT_BROKER_HOST: mqtt-broker
      DB_HOST: timescaledb

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    depends_on:
      - timescaledb
    environment:
      DB_HOST: timescaledb
    ports:
      - "8000:8000"

volumes:
  timescale-data: